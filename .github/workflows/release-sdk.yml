name: Release @writz/sdk

# Push a tag `sdk-v<version>` matching packages/sdk/package.json to publish to
# npm with provenance and create the GitHub Release. Steps: packages/sdk/RELEASING.md.
#
# Authentication: npm trusted publishing (OIDC) when it is configured for this
# repository, this workflow and the `npm` environment on npmjs.com; otherwise
# the NPM_TOKEN secret. The first publish of a package needs NPM_TOKEN: npm
# can only attach a trusted publisher to a package that already exists.
#
# Run it by hand (Actions > Release @writz/sdk > Run workflow) with dry_run
# checked to run every step with `--dry-run`, check NPM_TOKEN with
# `npm whoami`, and skip the GitHub Release. Nothing is published.
on:
  push:
    tags:
      - "sdk-v*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run: build, test, pack and check the token, publish nothing"
        type: boolean
        default: true

permissions:
  contents: write
  id-token: write

concurrency:
  group: release-sdk
  cancel-in-progress: false

jobs:
  publish:
    name: publish to npm
    runs-on: ubuntu-latest
    environment: npm
    env:
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
    defaults:
      run:
        working-directory: packages/sdk
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      # Trusted publishing needs npm 11.5.1 or later.
      - run: npm install -g npm@11
      - name: Tag matches package.json version
        if: env.DRY_RUN != 'true'
        run: |
          version=$(node -p 'require("./package.json").version')
          if [ "sdk-v$version" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME does not match package.json version $version" >&2
            exit 1
          fi
      - name: Network preset matches contracts/deployments/testnet.md
        run: node ../../scripts/sync-deployments.mjs --check
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test
      - run: bun run build
      - name: Check NPM_TOKEN
        if: env.DRY_RUN == 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "NPM_TOKEN is not set: a real publish needs trusted publishing configured on npmjs.com" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "NPM_TOKEN authenticates as $(npm whoami)" >> "$GITHUB_STEP_SUMMARY"
          fi
      # With trusted publishing configured, npm authenticates with OIDC first
      # and does not use the token, so an empty NPM_TOKEN is fine then.
      - name: Publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            npm publish --provenance --access public --dry-run
          else
            npm publish --provenance --access public
          fi
      - name: GitHub Release
        if: env.DRY_RUN != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "@writz/sdk ${GITHUB_REF_NAME#sdk-v}" \
            --notes "Published to npm: https://www.npmjs.com/package/@writz/sdk/v/${GITHUB_REF_NAME#sdk-v}" \
            --generate-notes
