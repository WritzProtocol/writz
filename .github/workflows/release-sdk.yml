name: Release @writz/sdk

# Push a tag `sdk-v<version>` matching packages/sdk/package.json to publish to
# npm with provenance and create the GitHub Release.
#
# Authentication: npm trusted publishing (OIDC) when it is configured for
# this repository and workflow on npmjs.com; otherwise the NPM_TOKEN secret.
on:
  push:
    tags:
      - "sdk-v*"

permissions:
  contents: write
  id-token: write

concurrency:
  group: release-sdk
  cancel-in-progress: false

jobs:
  publish:
    name: publish to npm
    runs-on: ubuntu-latest
    environment: npm
    defaults:
      run:
        working-directory: packages/sdk
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      # Trusted publishing needs npm 11.5.1 or later.
      - run: npm install -g npm@11
      - name: Tag matches package.json version
        run: |
          version=$(node -p 'require("./package.json").version')
          if [ "sdk-v$version" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME does not match package.json version $version" >&2
            exit 1
          fi
      - name: Network preset matches contracts/deployments/testnet.md
        run: node ../../scripts/sync-deployments.mjs --check
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test
      - run: bun run build
      - name: Publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --provenance --access public
      - name: GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "@writz/sdk ${GITHUB_REF_NAME#sdk-v}" \
            --notes "Published to npm: https://www.npmjs.com/package/@writz/sdk/v/${GITHUB_REF_NAME#sdk-v}" \
            --generate-notes
