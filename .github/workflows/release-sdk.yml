name: Release @writz/sdk

# Push a tag `sdk-v<version>` matching packages/sdk/package.json to publish to
# npm with provenance and create the GitHub Release. Steps: packages/sdk/RELEASING.md.
#
# Authentication: npm trusted publishing (OIDC) only. npmjs.com trusts this
# repository, this workflow and the `npm` environment; there is no npm token,
# and the package refuses token publishes.
#
# Run it by hand (Actions > Release @writz/sdk > Run workflow) with dry_run
# checked to run every step with `--dry-run` and skip the GitHub Release.
# Nothing is published.
on:
  push:
    tags:
      - "sdk-v*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run: build, test and pack, publish nothing"
        type: boolean
        default: true

permissions:
  contents: write
  id-token: write

concurrency:
  group: release-sdk
  cancel-in-progress: false

jobs:
  publish:
    name: publish to npm
    runs-on: ubuntu-latest
    environment: npm
    env:
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
    defaults:
      run:
        working-directory: packages/sdk
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      # Trusted publishing needs npm 11.5.1 or later.
      - run: npm install -g npm@11
      - name: Tag matches package.json version
        if: env.DRY_RUN != 'true'
        run: |
          version=$(node -p 'require("./package.json").version')
          if [ "sdk-v$version" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME does not match package.json version $version" >&2
            exit 1
          fi
      - name: Network preset matches contracts/deployments/testnet.md
        run: node ../../scripts/sync-deployments.mjs --check
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test
      - run: bun run build
      # npm exchanges the workflow's OIDC token for a short-lived publish
      # credential (trusted publishing, npm 11.5.1 or later).
      - name: Publish
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            npm publish --provenance --access public --dry-run
          else
            npm publish --provenance --access public
          fi
      - name: GitHub Release
        if: env.DRY_RUN != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "@writz/sdk ${GITHUB_REF_NAME#sdk-v}" \
            --notes "Published to npm: https://www.npmjs.com/package/@writz/sdk/v/${GITHUB_REF_NAME#sdk-v}" \
            --generate-notes
