name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: detect changed areas
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      relayer: ${{ steps.filter.outputs.relayer }}
      bitcoin_script: ${{ steps.filter.outputs.bitcoin_script }}
      contracts: ${{ steps.filter.outputs.contracts }}
      circuits: ${{ steps.filter.outputs.circuits }}
      e2e: ${{ steps.filter.outputs.e2e }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            frontend:
              - 'frontend/**'
              - '.github/workflows/ci.yml'
            relayer:
              - 'relayer/**'
              - 'packages/commitment-tree/**'
              - 'bitcoin-script/**'
              - 'Dockerfile'
              - '.dockerignore'
              - '.github/workflows/ci.yml'
            bitcoin_script:
              - 'bitcoin-script/**'
              - '.github/workflows/ci.yml'
            contracts:
              - 'contracts/**'
              - '.github/workflows/ci.yml'
            circuits:
              - 'circuits/**'
              - '.github/workflows/ci.yml'
            e2e:
              - 'contracts/**'
              - 'circuits/**'
              - 'scripts/deploy/**'
              - '.github/workflows/ci.yml'

  # Cheap, dependency-free (only Node builtins), so it always runs rather
  # than being gated by the changes filter - a stale contract address or
  # test count can be introduced by editing docs/ alone, which nothing
  # else in this workflow would catch.
  docs-sync:
    name: docs sync (contract addresses + test counts)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/check-docs-sync.mjs

  # Same always-run rationale as docs-sync: Mintlify parses pages as MDX and
  # only re-parses what a push changed, so a syntax error can sit in a page
  # for months and then break the deploy on an unrelated PR that merely
  # touches it. Cheap, and gated by nothing.
  docs-mdx:
    name: docs mdx (mintlify parse check)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: scripts/docs-mdx
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-
      - run: bun install --frozen-lockfile
      - run: bun run check

  frontend:
    name: frontend ${{ matrix.app }} (bun · lint + test + build)
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [app, landing]
    defaults:
      run:
        working-directory: frontend/${{ matrix.app }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run test
      - run: bun run build

  relayer:
    name: relayer (bun · typecheck + test)
    needs: changes
    if: needs.changes.outputs.relayer == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-
      - run: bun install --frozen-lockfile
        working-directory: packages/commitment-tree
      # relayer's repay-watcher depends on the local
      # @writz/bitcoin-script package's built dist/ output (its `main`
      # field points there) - build it before relayer's own install/test.
      - run: bun install --frozen-lockfile
        working-directory: bitcoin-script
      - run: bun run build
        working-directory: bitcoin-script
      - run: bun install --frozen-lockfile
        working-directory: relayer
      - run: bun run typecheck
        working-directory: relayer
      - run: bun run lint
        working-directory: relayer
      - run: bun run test
        working-directory: relayer
      # insert-auth.bun.test.ts imports @stellar/stellar-sdk statically, which
      # ts-jest's CommonJS loader can't parse (see jest.config.js) - run it
      # under Bun instead, same as test:e2e.
      - run: bun run test:bun
        working-directory: relayer

  relayer-docker-build:
    name: relayer (docker build + boot smoke test)
    needs: changes
    if: needs.changes.outputs.relayer == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build relayer image
        run: docker build -f Dockerfile -t writz-relayer-ci .
      - name: Boot container and check /health
        run: |
          docker run -d --name relayer-smoke -p 3000:3000 -e BITCOIN_NETWORK=signet writz-relayer-ci
          for i in $(seq 1 15); do
            if curl -sf http://localhost:3000/health; then
              echo "relayer is healthy"
              exit 0
            fi
            sleep 1
          done
          echo "relayer never became healthy" >&2
          docker logs relayer-smoke
          exit 1

  bitcoin-script:
    name: bitcoin-script (bun · test)
    needs: changes
    if: needs.changes.outputs.bitcoin_script == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bitcoin-script
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun test

  contracts:
    name: contracts (clippy + cargo test)
    needs: changes
    if: needs.changes.outputs.contracts == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: contracts
      # -D warnings with an explicit allow-list: a workspace-wide run
      # (2026-09-19) surfaced pre-existing violations of these lints across
      # the four crates, unrelated to any feature work landing alongside
      # this step - none audited or fixed yet, so they stay non-blocking.
      # Every other lint is denied, so a genuinely new violation still
      # fails CI. Drop an entry here once its backlog is cleaned up.
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings -A clippy::bool-assert-comparison -A clippy::doc-overindented-list-items -A clippy::empty-line-after-doc-comments -A clippy::manual-is-multiple-of -A clippy::manual-repeat-n -A clippy::needless-borrows-for-generic-args -A clippy::too-many-arguments -A clippy::unnecessary-cast
      - run: cargo test --workspace --locked

  circuits:
    name: circuits (circom compile + test)
    needs: changes
    if: needs.changes.outputs.circuits == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: circuits
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: circuits/package-lock.json
      # circuits/ is npm-managed (package-lock.json), unlike the bun-managed
      # bitcoin-script/relayer packages - matches its existing convention.
      - run: npm ci
      - name: Cache circom binary
        id: cache-circom
        uses: actions/cache@v4
        with:
          path: ~/.local/bin/circom
          key: circom-v2.2.3
      # actions/cache's restore step runs as the unprivileged runner user
      # (no sudo), so the cached path must be runner-owned rather than a
      # system directory like /usr/local/bin - otherwise a cache hit could
      # fail to restore with a permission error.
      - name: Add circom install dir to PATH
        run: echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Install circom
        if: steps.cache-circom.outputs.cache-hit != 'true'
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -fL -o /tmp/circom https://github.com/iden3/circom/releases/download/v2.2.3/circom-linux-amd64
          chmod +x /tmp/circom
          mv /tmp/circom "$HOME/.local/bin/circom"
      - name: Ensure cached circom is executable
        if: steps.cache-circom.outputs.cache-hit == 'true'
        run: chmod +x "$HOME/.local/bin/circom"
      - name: Cache compiled circuits + dev trusted setup
        id: cache-circuits
        uses: actions/cache@v4
        with:
          path: |
            circuits/build
            circuits/ptau
            circuits/keys
          # IMPORTANT: Bump this key's "-v1" suffix when the circom version
          # in the "Cache circom binary" step (above) changes - the hash below
          # only covers circuit sources and setup scripts, not the compiler
          # version. A circom version upgrade requires a manual bump here too,
          # or stale compiled output will silently be reused with the new compiler.
          key: circuits-setup-v1-${{ hashFiles('circuits/src/**', 'circuits/scripts/compile_all.sh', 'circuits/scripts/setup_dev.sh') }}
      - run: npm run compile
        if: steps.cache-circuits.outputs.cache-hit != 'true'
      # The existing test suite proves real deposit/borrow_repay/liquidation
      # circuits via snarkjs, which needs proving keys - same dev trusted
      # setup already used locally (see scripts/setup_dev.sh's own "NOT for
      # production" warning; this is a test-only key generation step, not
      # part of the production ceremony. Skipped on cache hit - see the
      # "Cache compiled circuits" step above; only reruns when circuit
      # sources or the setup scripts themselves change.
      - run: npm run setup:dev
        if: steps.cache-circuits.outputs.cache-hit != 'true'
      - run: npm test

  # Runs the real contracts and the real Groth16 proofs on a local Stellar
  # network - no testnet, no secrets. Unit tests mock auth; this does not, and
  # it exercises the constructor deploy path and cross-contract calls for real.
  e2e-local:
    name: e2e (local Stellar network)
    needs: changes
    if: needs.changes.outputs.e2e == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32v1-none
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: contracts
      - name: Build the contracts the run deploys
        working-directory: contracts
        run: cargo build --release --target wasm32v1-none --locked -p zk-verifier -p bitcoin-spv -p commitment-tree -p private-lend
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: circuits/package-lock.json
      - name: Install circuit dependencies
        working-directory: circuits
        run: npm ci
      - name: Cache circom binary
        id: cache-circom
        uses: actions/cache@v4
        with:
          path: ~/.local/bin/circom
          key: circom-v2.2.3
      - name: Add circom install dir to PATH
        run: echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Install circom
        if: steps.cache-circom.outputs.cache-hit != 'true'
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -fL -o /tmp/circom https://github.com/iden3/circom/releases/download/v2.2.3/circom-linux-amd64
          chmod +x /tmp/circom
          mv /tmp/circom "$HOME/.local/bin/circom"
      - name: Ensure cached circom is executable
        if: steps.cache-circom.outputs.cache-hit == 'true'
        run: chmod +x "$HOME/.local/bin/circom"
      # Same key as the circuits job, so the compiled circuits and dev
      # trusted setup are shared between the two.
      - name: Cache compiled circuits + dev trusted setup
        id: cache-circuits
        uses: actions/cache@v4
        with:
          path: |
            circuits/build
            circuits/ptau
            circuits/keys
          key: circuits-setup-v1-${{ hashFiles('circuits/src/**', 'circuits/scripts/compile_all.sh', 'circuits/scripts/setup_dev.sh') }}
      - name: Compile circuits
        working-directory: circuits
        if: steps.cache-circuits.outputs.cache-hit != 'true'
        run: npm run compile
      - name: Dev trusted setup
        working-directory: circuits
        if: steps.cache-circuits.outputs.cache-hit != 'true'
        run: npm run setup:dev
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Install deploy-script dependencies
        working-directory: scripts/deploy
        run: bun install --frozen-lockfile
      # Pinned by digest: the run was verified against this image
      # (stellar-core v29, protocol 29).
      - name: Start a local Stellar network
        run: |
          docker run -d --name stellar-local -p 8000:8000 \
            stellar/quickstart@sha256:4c8bad1ef7341205b898f83d9489321da80c7bd74183100fc8e2a39a5938c7d5 \
            --local --enable rpc
          for i in $(seq 1 60); do
            if curl -sf http://localhost:8000/soroban/rpc -X POST -H 'content-type: application/json' \
              -d '{"jsonrpc":"2.0","id":1,"method":"getHealth"}' | grep -q healthy; then
              echo "network healthy"; exit 0
            fi
            sleep 5
          done
          echo "local network never became healthy" >&2
          docker logs stellar-local | tail -50
          exit 1
      - name: Run the end-to-end flow
        run: node scripts/deploy/e2e_local.mjs
      - name: Network logs on failure
        if: failure()
        run: docker logs stellar-local | tail -100

  # Gates committed ceremony/verification-key artifacts. This is
  # a mechanical sanity check (hash + IC-length + transcript consistency),
  # not a substitute for the human verification steps in
  # circuits/scripts/ceremony/README.md. Cheap no-op until
  # keys/CEREMONY_MANIFEST.json exists (i.e. until a real ceremony has run
  # at least once) - the repo currently only has dev keys, so this job
  # exits early on every run today; it activates automatically the moment
  # 04_export.js writes a manifest.
  circuits-ceremony-verify:
    name: circuits ceremony verify
    needs: changes
    if: needs.changes.outputs.circuits == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: circuits
    steps:
      - uses: actions/checkout@v4
      - name: Check for ceremony manifest
        id: check
        run: |
          if [ ! -f keys/CEREMONY_MANIFEST.json ]; then
            echo "No CEREMONY_MANIFEST.json yet - nothing to verify (dev keys only so far)."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v4
        if: steps.check.outputs.skip == 'false'
        with:
          node-version: 20
      # No `npm ci` needed - the verification steps below only use Node's
      # built-in fs/crypto modules, no dependencies.
      - name: Verify manifest hashes match committed vkeys
        if: steps.check.outputs.skip == 'false'
        run: |
          node -e '
            const fs = require("fs");
            const crypto = require("crypto");
            const manifest = JSON.parse(fs.readFileSync("keys/CEREMONY_MANIFEST.json", "utf8"));
            let failed = false;
            for (const [circuit, entry] of Object.entries(manifest)) {
              const vkeyPath = `keys/${circuit}_vkey.json`;
              if (!fs.existsSync(vkeyPath)) {
                console.error(`ERROR: ${vkeyPath} referenced in manifest but not found`);
                failed = true;
                continue;
              }
              const actualHash = crypto.createHash("sha256").update(fs.readFileSync(vkeyPath)).digest("hex");
              if (actualHash !== entry.vkey_sha256) {
                console.error(`ERROR: ${vkeyPath} hash mismatch - manifest says ${entry.vkey_sha256}, actual is ${actualHash}`);
                failed = true;
              } else {
                console.log(`  ✓ ${circuit}: vkey hash matches manifest`);
              }
              if (/dev/i.test(JSON.stringify(entry))) {
                console.error(`ERROR: ${circuit}'s manifest entry references "dev" - refusing a development ceremony as production`);
                failed = true;
              }
            }
            if (failed) process.exit(1);
          '
      - name: Verify IC length matches zk-verifier expectations
        if: steps.check.outputs.skip == 'false'
        run: |
          node -e '
            const fs = require("fs");
            const EXPECTED = { deposit: 7, borrow_repay: 11, liquidation: 6, zero_debt: 4, insert: 5 };
            const manifest = JSON.parse(fs.readFileSync("keys/CEREMONY_MANIFEST.json", "utf8"));
            let failed = false;
            for (const [circuit, entry] of Object.entries(manifest)) {
              const expected = EXPECTED[circuit];
              if (expected === undefined) {
                console.error(`ERROR: unknown circuit "${circuit}" in manifest`);
                failed = true;
                continue;
              }
              if (entry.ic_length !== expected) {
                console.error(`ERROR: ${circuit} manifest ic_length=${entry.ic_length}, expected ${expected} - ` +
                  "this must match contracts/contracts/zk-verifier/src/test_vectors.rs's public-signal counts");
                failed = true;
              } else {
                console.log(`  ✓ ${circuit}: IC length matches expected (${expected})`);
              }
            }
            if (failed) process.exit(1);
          '

  ci-summary:
    name: CI summary
    if: always()
    needs:
      - changes
      - docs-sync
      - frontend
      - relayer
      - relayer-docker-build
      - bitcoin-script
      - contracts
      - circuits
      - circuits-ceremony-verify
      - e2e-local
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any non-skipped job failed
        if: contains(needs.*.result, 'failure')
        run: |
          echo "One or more CI jobs failed."
          exit 1
      - name: All good
        if: "!contains(needs.*.result, 'failure')"
        run: echo "No required job failed."
