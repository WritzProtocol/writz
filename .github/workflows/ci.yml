name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: frontend (bun · lint + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run build

  relayer:
    name: relayer (bun · typecheck + test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
        working-directory: packages/commitment-tree
      # relayer's repay-watcher depends on the local
      # @writz/bitcoin-script package's built dist/ output (its `main`
      # field points there) — build it before relayer's own install/test.
      - run: bun install --frozen-lockfile
        working-directory: bitcoin-script
      - run: bun run build
        working-directory: bitcoin-script
      - run: bun install --frozen-lockfile
        working-directory: relayer
      - run: bun run typecheck
        working-directory: relayer
      - run: bun run test
        working-directory: relayer

  bitcoin-script:
    name: bitcoin-script (bun · test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bitcoin-script
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun test

  contracts:
    name: contracts (cargo test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: contracts
      - run: cargo test --workspace --locked

  circuits:
    name: circuits (circom compile + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: circuits
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # circuits/ is npm-managed (package-lock.json), unlike the bun-managed
      # bitcoin-script/relayer packages — matches its existing convention.
      - run: npm ci
      - name: Install circom
        run: |
          curl -fL -o /tmp/circom https://github.com/iden3/circom/releases/download/v2.2.3/circom-linux-amd64
          chmod +x /tmp/circom
          sudo mv /tmp/circom /usr/local/bin/circom
      - run: npm run compile
      # The existing test suite proves real deposit/borrow_repay/liquidation
      # circuits via snarkjs, which needs proving keys — same dev trusted
      # setup already used locally (see scripts/setup_dev.sh's own "NOT for
      # production" warning; this is a test-only key generation step, not
      # part of the production ceremony.
      - run: npm run setup:dev
      - run: npm test

  # Gates committed ceremony/verification-key artifacts. This is
  # a mechanical sanity check (hash + IC-length + transcript consistency),
  # not a substitute for the human verification steps in
  # circuits/scripts/ceremony/README.md. Cheap no-op until
  # keys/CEREMONY_MANIFEST.json exists (i.e. until a real ceremony has run
  # at least once) — the repo currently only has dev keys, so this job
  # exits early on every run today; it activates automatically the moment
  # 04_export.js writes a manifest.
  circuits-ceremony-verify:
    name: circuits ceremony verify
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: circuits
    steps:
      - uses: actions/checkout@v4
      - name: Check for ceremony manifest
        id: check
        run: |
          if [ ! -f keys/CEREMONY_MANIFEST.json ]; then
            echo "No CEREMONY_MANIFEST.json yet — nothing to verify (dev keys only so far)."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v4
        if: steps.check.outputs.skip == 'false'
        with:
          node-version: 20
      # No `npm ci` needed — the verification steps below only use Node's
      # built-in fs/crypto modules, no dependencies.
      - name: Verify manifest hashes match committed vkeys
        if: steps.check.outputs.skip == 'false'
        run: |
          node -e '
            const fs = require("fs");
            const crypto = require("crypto");
            const manifest = JSON.parse(fs.readFileSync("keys/CEREMONY_MANIFEST.json", "utf8"));
            let failed = false;
            for (const [circuit, entry] of Object.entries(manifest)) {
              const vkeyPath = `keys/${circuit}_vkey.json`;
              if (!fs.existsSync(vkeyPath)) {
                console.error(`ERROR: ${vkeyPath} referenced in manifest but not found`);
                failed = true;
                continue;
              }
              const actualHash = crypto.createHash("sha256").update(fs.readFileSync(vkeyPath)).digest("hex");
              if (actualHash !== entry.vkey_sha256) {
                console.error(`ERROR: ${vkeyPath} hash mismatch — manifest says ${entry.vkey_sha256}, actual is ${actualHash}`);
                failed = true;
              } else {
                console.log(`  ✓ ${circuit}: vkey hash matches manifest`);
              }
              if (/dev/i.test(JSON.stringify(entry))) {
                console.error(`ERROR: ${circuit}'s manifest entry references "dev" — refusing a development ceremony as production`);
                failed = true;
              }
            }
            if (failed) process.exit(1);
          '
      - name: Verify IC length matches zk-verifier expectations
        if: steps.check.outputs.skip == 'false'
        run: |
          node -e '
            const fs = require("fs");
            const EXPECTED = { deposit: 6, borrow_repay: 9, liquidation: 6, zero_debt: 2 };
            const manifest = JSON.parse(fs.readFileSync("keys/CEREMONY_MANIFEST.json", "utf8"));
            let failed = false;
            for (const [circuit, entry] of Object.entries(manifest)) {
              const expected = EXPECTED[circuit];
              if (expected === undefined) {
                console.error(`ERROR: unknown circuit "${circuit}" in manifest`);
                failed = true;
                continue;
              }
              if (entry.ic_length !== expected) {
                console.error(`ERROR: ${circuit} manifest ic_length=${entry.ic_length}, expected ${expected} — ` +
                  "this must match contracts/contracts/zk-verifier/src/test_vectors.rs's public-signal counts");
                failed = true;
              } else {
                console.log(`  ✓ ${circuit}: IC length matches expected (${expected})`);
              }
            }
            if (failed) process.exit(1);
          '
