name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Read-only token by default; jobs widen it only where needed.
permissions:
  contents: read

jobs:
  changes:
    name: detect changed areas
    runs-on: ubuntu-latest
    # paths-filter lists PR files through the API on pull_request events.
    permissions:
      contents: read
      pull-requests: read
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      relayer: ${{ steps.filter.outputs.relayer }}
      bitcoin_script: ${{ steps.filter.outputs.bitcoin_script }}
      contracts: ${{ steps.filter.outputs.contracts }}
      e2e: ${{ steps.filter.outputs.e2e }}
      sdk: ${{ steps.filter.outputs.sdk }}
      examples: ${{ steps.filter.outputs.examples }}
      bindings: ${{ steps.filter.outputs.bindings }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            frontend:
              - 'frontend/**'
              - '.github/workflows/ci.yml'
            relayer:
              - 'relayer/**'
              - 'packages/writz-lend/**'
              - 'bitcoin-script/**'
              - 'Dockerfile'
              - '.dockerignore'
              - '.github/workflows/ci.yml'
            bitcoin_script:
              - 'bitcoin-script/**'
              - '.github/workflows/ci.yml'
            contracts:
              - 'contracts/**'
              - '.github/workflows/ci.yml'
            e2e:
              - 'contracts/**'
              - 'scripts/deploy/**'
              - '.github/workflows/ci.yml'
            sdk:
              - 'packages/sdk/**'
              - 'contracts/deployments/**'
              - 'scripts/sync-deployments.mjs'
              - 'scripts/lib/**'
              - '.github/workflows/ci.yml'
            examples:
              - 'examples/**'
              - 'contracts/contracts/spv-types/**'
              - '.github/workflows/ci.yml'
            bindings:
              - 'contracts/**'
              - 'packages/writz-lend/**'
              - 'scripts/writz-lend-bindings.sh'
              - '.github/workflows/ci.yml'

  # Cheap, dependency-free (only Node builtins), so it always runs rather
  # than being gated by the changes filter - a stale contract address or
  # test count can be introduced by editing docs/ alone, which nothing
  # else in this workflow would catch.
  docs-sync:
    name: docs sync (contract addresses + test counts)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/check-docs-sync.mjs

  # Same always-run rationale as docs-sync: Mintlify parses pages as MDX and
  # only re-parses what a push changed, so a syntax error can sit in a page
  # for months and then break the deploy on an unrelated PR that merely
  # touches it. Cheap, and gated by nothing.
  docs-mdx:
    name: docs mdx (mintlify parse check)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: scripts/docs-mdx
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-
      - run: bun install --frozen-lockfile
      - run: bun run check

  frontend:
    name: frontend ${{ matrix.app }} (bun · lint + test + build)
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [app, landing]
    defaults:
      run:
        working-directory: frontend/${{ matrix.app }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run test
      - run: bun run build

  relayer:
    name: relayer (bun · typecheck + test)
    needs: changes
    if: needs.changes.outputs.relayer == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-
      - run: bun install --frozen-lockfile
        working-directory: packages/writz-lend
      # relayer's repay-watcher depends on the local
      # @writz/bitcoin-script package's built dist/ output (its `main`
      # field points there) - build it before relayer's own install/test.
      - run: bun install --frozen-lockfile
        working-directory: bitcoin-script
      - run: bun run build
        working-directory: bitcoin-script
      - run: bun install --frozen-lockfile
        working-directory: relayer
      - run: bun run typecheck
        working-directory: relayer
      - run: bun run lint
        working-directory: relayer
      - run: bun run test
        working-directory: relayer
      # insert-auth.bun.test.ts imports @stellar/stellar-sdk statically, which
      # ts-jest's CommonJS loader can't parse (see jest.config.js) - run it
      # under Bun instead, same as test:e2e.
      - run: bun run test:bun
        working-directory: relayer

  relayer-docker-build:
    name: relayer (docker build + boot smoke test)
    needs: changes
    if: needs.changes.outputs.relayer == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build relayer image
        run: docker build -f Dockerfile -t writz-relayer-ci .
      - name: Boot container and check /health
        run: |
          docker run -d --name relayer-smoke -p 3000:3000 -e BITCOIN_NETWORK=signet writz-relayer-ci
          for i in $(seq 1 15); do
            if curl -sf http://localhost:3000/health; then
              echo "relayer is healthy"
              exit 0
            fi
            sleep 1
          done
          echo "relayer never became healthy" >&2
          docker logs relayer-smoke
          exit 1

  # @writz/sdk: typecheck, unit tests (no network), the ESM build, a browser
  # bundle, and the npm tarball. The live testnet smoke test runs in
  # live-smoke.yml, not here, so a testnet outage cannot fail a PR.
  sdk:
    name: sdk (bun · typecheck + test + build + pack)
    permissions:
      contents: read
    needs: changes
    if: needs.changes.outputs.sdk == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/sdk
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-
      - name: Network preset matches contracts/deployments/testnet.md
        run: node ../../scripts/sync-deployments.mjs --check
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test
      - run: bun run build
      - name: Import the build from Node
        run: node -e 'import("./dist/index.js").then((m) => { if (!m.testnet.contracts.bitcoinSpv) process.exit(1); })'
      - run: bun run check:browser
      - run: npm pack --dry-run

  # Both examples must keep compiling. They are run against testnet in
  # live-smoke.yml.
  examples:
    name: examples (verify-bitcoin-tx typecheck · spv-payment-check test + wasm)
    permissions:
      contents: read
    needs: changes
    if: needs.changes.outputs.examples == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: verify-bitcoin-tx (install + typecheck)
        working-directory: examples/verify-bitcoin-tx
        run: |
          bun install --frozen-lockfile
          bun run typecheck
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32v1-none
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: examples/spv-payment-check
      - name: spv-payment-check (test + wasm build)
        working-directory: examples/spv-payment-check
        run: |
          cargo test --locked
          cargo build --release --target wasm32v1-none --locked

  bitcoin-script:
    name: bitcoin-script (bun · test)
    needs: changes
    if: needs.changes.outputs.bitcoin_script == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bitcoin-script
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun test

  contracts:
    name: contracts v1 (clippy + cargo test)
    needs: changes
    if: needs.changes.outputs.contracts == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: contracts
      # -D warnings with an explicit allow-list: a workspace-wide run
      # (2026-09-19) surfaced pre-existing violations of these lints across
      # the four crates, unrelated to any feature work landing alongside
      # this step - none audited or fixed yet, so they stay non-blocking.
      # Every other lint is denied, so a genuinely new violation still
      # fails CI. Drop an entry here once its backlog is cleaned up.
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings -A clippy::bool-assert-comparison -A clippy::doc-overindented-list-items -A clippy::empty-line-after-doc-comments -A clippy::manual-is-multiple-of -A clippy::manual-repeat-n -A clippy::needless-borrows-for-generic-args -A clippy::too-many-arguments -A clippy::unnecessary-cast
      - run: cargo test --workspace --locked

  # packages/writz-lend/src/index.ts (the relayer's) and the app's
  # writzLendGenerated.ts are generated from the contract (#259). Rebuild the
  # wasm, regenerate with the pinned CLI and fail on any diff in either, so
  # the bindings cannot drift from the contract. The CLI version must match
  # STELLAR_CLI_VERSION in the script.
  writz-lend-bindings:
    name: writz-lend bindings (regenerate + diff)
    needs: changes
    if: needs.changes.outputs.bindings == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32v1-none
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: contracts
      - name: Install stellar-cli 28.1.0
        run: |
          curl -fL -o /tmp/stellar-cli.tar.gz \
            https://github.com/stellar/stellar-cli/releases/download/v28.1.0/stellar-cli-28.1.0-x86_64-unknown-linux-gnu.tar.gz
          echo "c1680deee94301d33ada7a17f98411e642a4248c727afbd2e43050d345746462  /tmp/stellar-cli.tar.gz" | sha256sum -c -
          mkdir -p "$HOME/.local/bin"
          tar -xzf /tmp/stellar-cli.tar.gz -C "$HOME/.local/bin"
          "$HOME/.local/bin/stellar" --version
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - run: scripts/writz-lend-bindings.sh --check

  e2e-local:
    name: e2e (local Stellar network)
    needs: changes
    if: needs.changes.outputs.e2e == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32v1-none
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: contracts
      - name: Build the v1 contracts the run deploys
        working-directory: contracts
        run: cargo build --release --target wasm32v1-none --locked -p bitcoin-spv -p writz-lend
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Install deploy-script dependencies
        working-directory: scripts/deploy
        run: bun install --frozen-lockfile
      # Pinned by digest: the run was verified against this image
      # (stellar-core v29, protocol 29).
      - name: Start a local Stellar network
        run: |
          docker run -d --name stellar-local -p 8000:8000 \
            stellar/quickstart@sha256:4c8bad1ef7341205b898f83d9489321da80c7bd74183100fc8e2a39a5938c7d5 \
            --local --enable rpc
          for i in $(seq 1 60); do
            if curl -sf http://localhost:8000/soroban/rpc -X POST -H 'content-type: application/json' \
              -d '{"jsonrpc":"2.0","id":1,"method":"getHealth"}' | grep -q healthy; then
              echo "network healthy"; exit 0
            fi
            sleep 5
          done
          echo "local network never became healthy" >&2
          docker logs stellar-local | tail -50
          exit 1
      - name: Run the end-to-end flow
        run: node scripts/deploy/e2e_local.mjs
      - name: Network logs on failure
        if: failure()
        run: docker logs stellar-local | tail -100

  ci-summary:
    name: CI summary
    if: always()
    needs:
      - changes
      - docs-sync
      - frontend
      - relayer
      - relayer-docker-build
      - bitcoin-script
      - contracts
      - e2e-local
      - sdk
      - examples
      - writz-lend-bindings
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Fail if any non-skipped job failed
        if: contains(needs.*.result, 'failure')
        run: |
          echo "One or more CI jobs failed."
          exit 1
      - name: All good
        if: "!contains(needs.*.result, 'failure')"
        run: echo "No required job failed."
