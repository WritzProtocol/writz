name: Release writz-spv-client

# Push a tag `writz-spv-client-v<version>` matching
# contracts/contracts/writz-spv-client/Cargo.toml to publish the crate to
# crates.io and create the GitHub Release. Steps: packages/sdk/RELEASING.md.
#
# Authentication: crates.io trusted publishing (OIDC) only. crates.io trusts
# this repository, this workflow and the `crates-io` environment, and hands
# the job a token that expires after 30 minutes; there is no stored token.
#
# Run it by hand (Actions > Release writz-spv-client > Run workflow) with
# dry_run checked to run every step with `--dry-run` and skip the GitHub
# Release. Nothing is published.
on:
  push:
    tags:
      - "writz-spv-client-v*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run: test, package and verify the crate, publish nothing"
        type: boolean
        default: true

permissions:
  contents: write
  id-token: write

concurrency:
  group: release-spv-client
  cancel-in-progress: false

jobs:
  publish:
    name: publish to crates.io
    runs-on: ubuntu-latest
    environment: crates-io
    env:
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32v1-none
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: contracts
      - name: Tag matches Cargo.toml version
        if: env.DRY_RUN != 'true'
        run: |
          version=$(cargo metadata --no-deps --format-version 1 \
            | python3 -c 'import json,sys; print(next(p["version"] for p in json.load(sys.stdin)["packages"] if p["name"]=="writz-spv-client"))')
          if [ "writz-spv-client-v$version" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME does not match Cargo.toml version $version" >&2
            exit 1
          fi
      - run: cargo test -p writz-spv-client --locked
      - run: cargo build -p writz-spv-client --release --target wasm32v1-none --locked
      - name: Authenticate with crates.io
        if: env.DRY_RUN != 'true'
        id: auth
        uses: rust-lang/crates-io-auth-action@v1
      # cargo publish packages the crate and builds it on its own, outside the
      # workspace, before uploading (the same check as `cargo package`).
      - name: Publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            cargo publish -p writz-spv-client --locked --dry-run
          else
            cargo publish -p writz-spv-client --locked
          fi
      - name: GitHub Release
        if: env.DRY_RUN != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "writz-spv-client ${GITHUB_REF_NAME#writz-spv-client-v}" \
            --notes "Published to crates.io: https://crates.io/crates/writz-spv-client/${GITHUB_REF_NAME#writz-spv-client-v}" \
            --generate-notes
