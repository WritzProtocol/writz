[package]
name = "bitcoin-spv"
version = "0.0.0"
edition = "2021"
publish = false

[lib]
crate-type = ["lib", "cdylib"]
doctest = false

[dependencies]
soroban-sdk = { workspace = true }
spv-types = { path = "../spv-types" }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
