<body><div class="frame"><p class="eyebrow">How Writz works</p><h1>How a Writz loan works</h1>

<title id="full-picture-title">How a Writz loan works</title>
<desc id="full-picture-desc">You lock Bitcoin in your own vault on Bitcoin, Stellar verifies the lock with an SPV proof after six confirmations, you borrow USDC from writz-lend, repay it with interest, and Writz co-signs so you can release your Bitcoin; if Writz stops, you can take it back alone after the timelock height.</desc>

<text x="120.0" y="114.0" fill="#15181E" font-size="16" font-weight="600" font-family="'Work Sans', system-ui, sans-serif" text-anchor="middle">Lock BTC</text>

<rect x="408" y="248" width="160" height="72" rx="6" fill="#F6F7F8"/>
<rect x="408" y="248" width="160" height="72" rx="6" fill="#FFC300" stroke="#15181E" stroke-width="1.4"/>

<text x="488.0" y="290.0" fill="#15181E" font-size="16" font-weight="600" font-family="'Work Sans', system-ui, sans-serif" text-anchor="middle">Borrow USDC</text>

<rect x="592" y="248" width="160" height="72" rx="6" fill="#F6F7F8"/>

<rect x="776" y="72" width="160" height="72" rx="6" fill="#F6F7F8" stroke="#15181E" stroke-width="1"/>

<text x="805.5" y="90" fill="#4B515B" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">STEP 5</text>
<text x="856.0" y="114.0" fill="#15181E" font-size="16" font-weight="600" font-family="'Work Sans', system-ui, sans-serif" text-anchor="middle">Release BTC</text>
<text x="856.0" y="133.0" fill="#4B515B" font-size="12" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">you sign, broadcast</text>
<rect x="408" y="72" width="160" height="72" rx="6" fill="#F6F7F8"/>
<rect x="408" y="72" width="160" height="72" rx="6" fill="#F6F7F8" stroke="#4B515B" stroke-width="1" stroke-dasharray="4,3"/>
<rect x="416" y="80" width="53" height="14" rx="2" fill="none" stroke="#4B515B" stroke-opacity="0.5" stroke-width="0.8"/>
<text x="442.5" y="90" fill="#4B515B" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">FALLBACK</text>
<text x="488.0" y="114.0" fill="#15181E" font-size="16" font-weight="600" font-family="'Work Sans', system-ui, sans-serif" text-anchor="middle">Timelock exit</text>
<text x="488.0" y="133.0" fill="#4B515B" font-size="12" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">you alone</text>
<text x="24" y="400" fill="#4B515B" font-size="15" font-style="italic" font-family="'Work Sans', system-ui, sans-serif">Your Bitcoin never leaves Bitcoin: Stellar only checks a proof that it is locked.</text>
<line x1="32" y1="440" x2="928" y2="440" stroke="rgba(21,24,30,0.12)" stroke-width="0.8"/>
