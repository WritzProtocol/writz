<body><div class="frame"><p class="eyebrow">Sequence</p><h1>What happens inside a deposit</h1>
<div class="diagram-container">

<title id="deposit-calls-title">What happens inside a deposit</title>
<desc id="deposit-calls-desc">The user gets an SPV proof from the relayer, signs a key-control message with the Bitcoin wallet and calls writz-lend deposit; writz-lend checks the script, asks bitcoin-spv to verify the transaction, checks the timelock height and the signature, consumes the txid in bitcoin-spv and stores the position.</desc>

<line x1="116" y1="176" x2="330" y2="176" stroke="#4B515B" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
<rect x="190.0" y="152" width="68" height="16" rx="2" fill="#F6F7F8"/><text x="224.0" y="164" fill="#646A73" font-size="10" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">SPV PROOF</text>

<rect x="672.0" y="384" width="48" height="16" rx="2" fill="#F6F7F8"/><text x="696.0" y="396" fill="#646A73" font-size="10" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">RESULT</text>

<line x1="580" y1="504" x2="810" y2="504" stroke="#4B515B" stroke-width="1.2" marker-end="url(#arrow)"/>

<path d="M580,532 H612 Q620,532 620,540 V548 Q620,556 612,556 H582" fill="none" stroke="#15181E" stroke-width="1.6" marker-end="url(#arrow-accent)"/>
<rect x="628" y="536" width="80" height="16" rx="2" fill="#F6F7F8"/><text x="668.0" y="548" fill="#646A73" font-size="10" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">STORE, EMIT</text>

<rect x="24.0" y="64" width="176" height="48" rx="6" fill="#F6F7F8"/>
<rect x="24.0" y="64" width="176" height="48" rx="6" fill="#F6F7F8" stroke="#15181E" stroke-width="1"/>

<text x="336.0" y="109.0" fill="#4B515B" font-size="12" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">browser</text>
<rect x="488.0" y="64" width="176" height="48" rx="6" fill="#F6F7F8"/>
<rect x="488.0" y="64" width="176" height="48" rx="6" fill="#FFC300" stroke="#15181E" stroke-width="1.4"/>
<text x="576.0" y="94.0" fill="#15181E" font-size="16" font-weight="600" font-family="'Work Sans', system-ui, sans-serif" text-anchor="middle">writz-lend</text>
<rect x="728.0" y="64" width="176" height="48" rx="6" fill="#F6F7F8"/>
<rect x="728.0" y="64" width="176" height="48" rx="6" fill="#F6F7F8" stroke="#15181E" stroke-width="1"/>
<text x="816.0" y="94.0" fill="#15181E" font-size="16" font-weight="600" font-family="'Work Sans', system-ui, sans-serif" text-anchor="middle">bitcoin-spv</text>
<text x="24" y="692" fill="#4B515B" font-size="15" font-style="italic" font-family="'Work Sans', system-ui, sans-serif">One call does it all: if any check fails, the deposit reverts and nothing is stored.</text>
<line x1="32" y1="728" x2="928" y2="728" stroke="rgba(21,24,30,0.12)" stroke-width="0.8"/>
<text x="32" y="756" fill="#4B515B" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.14em">LEGEND</text>
<line x1="96" y1="753" x2="116" y2="753" stroke="#4B515B" stroke-width="1.2"/>
<text x="124" y="758" fill="#15181E" font-size="12" font-family="'Work Sans', system-ui, sans-serif">Call</text>
<line x1="184" y1="753" x2="204" y2="753" stroke="#4B515B" stroke-width="1.2" stroke-dasharray="5,4"/>
<text x="212" y="758" fill="#15181E" font-size="12" font-family="'Work Sans', system-ui, sans-serif">Return</text>
