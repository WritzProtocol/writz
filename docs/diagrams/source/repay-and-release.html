<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Repaying a loan and releasing the Bitcoin</title>
<link href="https://fonts.googleapis.com/css2?family=Work+Sans:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Work Sans', system-ui, sans-serif;background:#F6F7F8;color:#15181E;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:3rem 2rem}
.frame{max-width:1000px;width:100%}.diagram-container{width:100%;overflow-x:auto}
.eyebrow{font-family:'Geist Mono', ui-monospace, monospace;font-size:.66rem;font-weight:500;letter-spacing:.18em;text-transform:uppercase;color:#4B515B;margin-bottom:.5rem}
h1{font-family:'Work Sans', system-ui, sans-serif;font-size:1.75rem;font-weight:600;letter-spacing:-.02em;line-height:1.15;margin-bottom:1.5rem}
svg{width:100%;min-width:960px;display:block}@media print{.diagram-container{overflow-x:visible}svg{min-width:0}}</style></head>
<body><div class="frame"><p class="eyebrow">Sequence</p><h1>Repaying a loan and releasing the Bitcoin</h1>
<div class="diagram-container">
<svg viewBox="0 0 960 784" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="repay-and-release-title repay-and-release-desc">
<title id="repay-and-release-title">Repaying a loan and releasing the Bitcoin</title>
<desc id="repay-and-release-desc">After a full repayment writz-lend emits an event, the protocol signers check the position on Stellar and publish their co-signature, and the borrower signs and broadcasts the release; if the signers are unavailable, the borrower spends alone after the timelock.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4B515B"/></marker><marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#15181E"/></marker><marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2A303A"/></marker><marker id="arrow-open" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polyline points="0 0, 8 3, 0 6" fill="none" stroke="#4B515B" stroke-width="1.2"/></marker></defs>
<rect width="100%" height="100%" fill="#F6F7F8"/>
<rect x="82" y="536" width="292" height="88" rx="4" fill="rgba(21,24,30,0.02)" stroke="rgba(21,24,30,0.22)" stroke-width="1"/>
<rect x="82" y="536" width="40" height="16" rx="2" fill="#F6F7F8" stroke="rgba(21,24,30,0.22)" stroke-width="1"/>
<text x="102" y="548" fill="#4B515B" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.12em">OPT</text>
<text x="134" y="548" fill="#4B515B" font-size="10" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.04em">[signers unavailable, after height H]</text>
<line x1="110" y1="112" x2="110" y2="640" stroke="rgba(21,24,30,0.22)" stroke-width="1" stroke-dasharray="3,3"/>
<line x1="330" y1="112" x2="330" y2="640" stroke="rgba(21,24,30,0.22)" stroke-width="1" stroke-dasharray="3,3"/>
<line x1="550" y1="112" x2="550" y2="640" stroke="rgba(21,24,30,0.22)" stroke-width="1" stroke-dasharray="3,3"/>
<line x1="760" y1="112" x2="760" y2="640" stroke="rgba(21,24,30,0.22)" stroke-width="1" stroke-dasharray="3,3"/>
<rect x="546" y="176" width="8" height="40" fill="rgba(21,24,30,0.06)" stroke="#4B515B" stroke-width="0.8"/>
<rect x="546" y="408" width="8" height="40" fill="rgba(21,24,30,0.06)" stroke="#4B515B" stroke-width="0.8"/>
<line x1="114" y1="176" x2="544" y2="176" stroke="#4B515B" stroke-width="1.2" marker-end="url(#arrow)"/>
<rect x="174.0" y="152" width="92" height="16" rx="2" fill="#F6F7F8"/><text x="220.0" y="164" fill="#646A73" font-size="10" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">REPAY IN FULL</text>
<line x1="546" y1="216" x2="116" y2="216" stroke="#4B515B" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
<rect x="398.0" y="192" width="84" height="16" rx="2" fill="#F6F7F8"/><text x="440.0" y="204" fill="#646A73" font-size="10" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">DEBT CLEARED</text>
<line x1="554" y1="264" x2="754" y2="264" stroke="#4B515B" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow-open)"/>
<rect x="613.0" y="240" width="84" height="16" rx="2" fill="#F6F7F8"/><text x="655.0" y="252" fill="#646A73" font-size="10" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">REPAID EVENT</text>
<path d="M764,292 H796 Q804,292 804,300 V308 Q804,316 796,316 H766" fill="none" stroke="#4B515B" stroke-width="1.2" marker-end="url(#arrow)"/>
<rect x="812" y="296" width="80" height="16" rx="2" fill="#F6F7F8"/><text x="852.0" y="308" fill="#646A73" font-size="10" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">CHECK STATE</text>
<line x1="756" y1="360" x2="556" y2="360" stroke="#4B515B" stroke-width="1.2" marker-end="url(#arrow)"/>
<rect x="607.0" y="336" width="96" height="16" rx="2" fill="#F6F7F8"/><text x="655.0" y="348" fill="#646A73" font-size="10" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">PUBLISH CO-SIG</text>
<line x1="114" y1="408" x2="544" y2="408" stroke="#4B515B" stroke-width="1.2" marker-end="url(#arrow)"/>
<rect x="180.0" y="384" width="80" height="16" rx="2" fill="#F6F7F8"/><text x="220.0" y="396" fill="#646A73" font-size="10" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">GET RELEASE</text>
<line x1="546" y1="448" x2="116" y2="448" stroke="#4B515B" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
<rect x="404.0" y="424" width="72" height="16" rx="2" fill="#F6F7F8"/><text x="440.0" y="436" fill="#646A73" font-size="10" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">RELEASE TX</text>
<line x1="114" y1="496" x2="324" y2="496" stroke="#15181E" stroke-width="1.6" marker-end="url(#arrow-accent)"/>
<rect x="168.0" y="472" width="104" height="16" rx="2" fill="#F6F7F8"/><text x="220.0" y="484" fill="#646A73" font-size="10" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">SIGN, BROADCAST</text>
<line x1="114" y1="600" x2="324" y2="600" stroke="#4B515B" stroke-width="1.2" marker-end="url(#arrow)"/>
<rect x="172.0" y="576" width="96" height="16" rx="2" fill="#F6F7F8"/><text x="220.0" y="588" fill="#646A73" font-size="10" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">TIMELOCK SPEND</text>
<rect x="30.0" y="64" width="160" height="48" rx="6" fill="#F6F7F8"/>
<rect x="30.0" y="64" width="160" height="48" rx="6" fill="#ECEEF1" stroke="#4B515B" stroke-width="1"/>
<text x="110.0" y="94.0" fill="#15181E" font-size="16" font-weight="600" font-family="'Work Sans', system-ui, sans-serif" text-anchor="middle">Borrower</text>
<rect x="250.0" y="64" width="160" height="48" rx="6" fill="#F6F7F8"/>
<rect x="250.0" y="64" width="160" height="48" rx="6" fill="#F6F7F8" stroke="#15181E" stroke-width="1"/>
<text x="330.0" y="94.0" fill="#15181E" font-size="16" font-weight="600" font-family="'Work Sans', system-ui, sans-serif" text-anchor="middle">Bitcoin</text>
<rect x="470.0" y="64" width="160" height="48" rx="6" fill="#F6F7F8"/>
<rect x="470.0" y="64" width="160" height="48" rx="6" fill="#FFC300" stroke="#15181E" stroke-width="1.4"/>
<text x="550.0" y="94.0" fill="#15181E" font-size="16" font-weight="600" font-family="'Work Sans', system-ui, sans-serif" text-anchor="middle">writz-lend</text>
<rect x="680.0" y="64" width="160" height="48" rx="6" fill="#F6F7F8"/>
<rect x="680.0" y="64" width="160" height="48" rx="6" fill="#F6F7F8" stroke="#15181E" stroke-width="1"/>
<text x="760.0" y="94.0" fill="#15181E" font-size="16" font-weight="600" font-family="'Work Sans', system-ui, sans-serif" text-anchor="middle">Protocol signers</text>
<text x="24" y="684" fill="#4B515B" font-size="15" font-style="italic" font-family="'Work Sans', system-ui, sans-serif">Each protocol signer checks Stellar on its own and co-signs only a repaid position.</text>
<line x1="32" y1="720" x2="928" y2="720" stroke="rgba(21,24,30,0.12)" stroke-width="0.8"/>
<text x="32" y="748" fill="#4B515B" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.14em">LEGEND</text>
<line x1="96" y1="745" x2="116" y2="745" stroke="#4B515B" stroke-width="1.2"/>
<text x="124" y="750" fill="#15181E" font-size="12" font-family="'Work Sans', system-ui, sans-serif">Call</text>
<line x1="184" y1="745" x2="204" y2="745" stroke="#4B515B" stroke-width="1.2" stroke-dasharray="5,4"/>
<text x="212" y="750" fill="#15181E" font-size="12" font-family="'Work Sans', system-ui, sans-serif">Return or event</text>
<line x1="352" y1="745" x2="372" y2="745" stroke="#15181E" stroke-width="1.6"/>
<text x="380" y="750" fill="#15181E" font-size="12" font-family="'Work Sans', system-ui, sans-serif">Bitcoin back to the borrower</text>
</svg>
</div></div></body></html>
