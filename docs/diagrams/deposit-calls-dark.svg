<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 792" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="deposit-calls-dark-title deposit-calls-dark-desc" id="deposit-calls-dark-root">
<title id="deposit-calls-dark-title">What happens inside a deposit</title>
<desc id="deposit-calls-dark-desc">The user gets an SPV proof from the relayer, signs a key-control message with the Bitcoin wallet and calls writz-lend deposit; writz-lend checks the script, asks bitcoin-spv to verify the transaction, checks the timelock height and the signature, consumes the txid in bitcoin-spv and stores the position.</desc>
