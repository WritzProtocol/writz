<svg viewBox="0 0 960 552" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="composability-title composability-desc" id="composability-root">
<title id="composability-title">How other protocols build on Writz</title>
<desc id="composability-desc">The Writz core in writz-lend handles the Bitcoin side once; the Writz Lend pool and a lending-market adapter are connectors that bring USDC to it, a vault strategy lets DeFindex vaults supply the pool, and a verification SDK lets other Stellar projects verify Bitcoin through bitcoin-spv.</desc>
