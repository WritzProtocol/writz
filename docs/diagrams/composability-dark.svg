<svg viewBox="0 0 1280 616" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="composability-dark-title composability-dark-desc" id="composability-dark-root">
<title id="composability-dark-title">How other protocols build on Writz</title>
<desc id="composability-dark-desc">The Writz core in writz-lend handles the Bitcoin side once; the Writz Lend pool and a lending-market adapter are connectors that bring USDC to it, a vault strategy lets DeFindex vaults supply the pool, and a verification SDK lets other Stellar projects verify Bitcoin through bitcoin-spv.</desc>
