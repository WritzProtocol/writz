<rect x="500.0" y="428" width="60" height="12" rx="2" fill="#F6F7F8"/><text x="530.0" y="437" fill="#646A73" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">RELEASE TX</text>
