<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1080 784" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="repay-and-release-title repay-and-release-desc" id="repay-and-release-root">
<title id="repay-and-release-title">Repaying a loan and releasing the Bitcoin</title>
<desc id="repay-and-release-desc">After a full repayment writz-lend emits an event, the protocol signers check the position on Stellar and publish their co-signature, and the borrower signs and broadcasts the release; if the signers are unavailable, the borrower spends alone after the timelock.</desc>
<defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #repay-and-release-root { font-family: 'Work Sans', system-ui, sans-serif; color: #15181E; }
      #repay-and-release-root .diagram-container { width:100%;overflow-x:auto }
      #repay-and-release-root .diagram-container { overflow-x:visible }</style><marker id="repay-and-release-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4B515B"/></marker><marker id="repay-and-release-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#15181E"/></marker><marker id="repay-and-release-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2A303A"/></marker><marker id="repay-and-release-arrow-open" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polyline points="0 0, 8 3, 0 6" fill="none" stroke="#4B515B" stroke-width="1.2"/></marker></defs>
<rect width="100%" height="100%" fill="#F6F7F8"/>
