<rect x="112" y="536" width="40" height="16" rx="2" fill="#F6F7F8" stroke="#15181e" stroke-width="1" stroke-opacity="0.22"/>
<text x="132" y="548" fill="#4B515B" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.12em">OPT</text>
<text x="164" y="548" fill="#4B515B" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.04em">[signers unavailable, after height H]</text>
