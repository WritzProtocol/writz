<rect x="308" y="64" width="184" height="48" rx="6" fill="#F6F7F8"/>
<rect x="308" y="64" width="184" height="48" rx="6" fill="#F6F7F8" stroke="#15181E" stroke-width="1"/>
<text x="400.0" y="92.0" fill="#15181E" font-size="13" font-weight="600" font-family="'Work Sans', system-ui, sans-serif" text-anchor="middle">Bitcoin</text>
<rect x="568" y="64" width="184" height="48" rx="6" fill="#F6F7F8"/>
<rect x="568" y="64" width="184" height="48" rx="6" fill="#FFC300" stroke="#15181E" stroke-width="1.4"/>
<text x="660.0" y="92.0" fill="#15181E" font-size="13" font-weight="600" font-family="'Work Sans', system-ui, sans-serif" text-anchor="middle">writz-lend</text>
<rect x="828" y="64" width="184" height="48" rx="6" fill="#F6F7F8"/>
<rect x="828" y="64" width="184" height="48" rx="6" fill="#F6F7F8" stroke="#15181E" stroke-width="1"/>
<text x="920.0" y="92.0" fill="#15181E" font-size="13" font-weight="600" font-family="'Work Sans', system-ui, sans-serif" text-anchor="middle">Protocol signers</text>
<text x="40" y="684" fill="#4B515B" font-size="13" font-style="italic" font-family="'Work Sans', system-ui, sans-serif">Each signer service reads Stellar state on its own and co-signs a release only for a repaid position.</text>
