<svg viewBox="0 0 960 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="system-architecture-dark-title system-architecture-dark-desc" id="system-architecture-dark-root">
<title id="system-architecture-dark-title">Writz Protocol system architecture</title>
<desc id="system-architecture-dark-desc">Borrowers lock Bitcoin in a Writz vault and borrow USDC from writz-lend on Stellar, which verifies the lock through the bitcoin-spv light client, prices it with two oracles, and is served by keepers, protocol signers and a relayer.</desc>
