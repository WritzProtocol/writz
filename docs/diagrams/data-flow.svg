<title id="data-flow-title">Data flow and trust boundaries</title>
<desc id="data-flow-desc">User wallets and the relayer are untrusted; the Writz vault on Bitcoin and the writz-lend and bitcoin-spv contracts on Soroban are trustless; the protocol co-signing key and the liquidation keeper are trusted Writz-operated components; the Reflector price feed is partially trusted.</desc>
