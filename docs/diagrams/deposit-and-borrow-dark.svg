      #deposit-and-borrow-dark-root { font-family: 'Work Sans', system-ui, sans-serif; color: #F6F7F8; }
      #deposit-and-borrow-dark-root .diagram-container { width:100%;overflow-x:auto }
      #deposit-and-borrow-dark-root .diagram-container { overflow-x:visible }</style><marker id="deposit-and-borrow-dark-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#B6BBC4"/></marker><marker id="deposit-and-borrow-dark-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#FFC300"/></marker><marker id="deposit-and-borrow-dark-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#8FB0D8"/></marker><marker id="deposit-and-borrow-dark-arrow-open" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polyline points="0 0, 8 3, 0 6" fill="none" stroke="#B6BBC4" stroke-width="1.2"/></marker></defs>
