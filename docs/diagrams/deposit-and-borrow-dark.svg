<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1280 848" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="deposit-and-borrow-dark-title deposit-and-borrow-dark-desc" id="deposit-and-borrow-dark-root">
<title id="deposit-and-borrow-dark-title">From a Bitcoin deposit to a USDC loan</title>
<desc id="deposit-and-borrow-dark-desc">The borrower locks Bitcoin, gets an SPV proof from the relayer, deposits it to writz-lend, which verifies the transaction through bitcoin-spv and opens the position, then borrows USDC after a price and health check.</desc>
