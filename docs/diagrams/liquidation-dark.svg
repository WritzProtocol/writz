<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 864" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="liquidation-dark-title liquidation-dark-desc" id="liquidation-dark-root">
<title id="liquidation-dark-title">Liquidation, settled on Bitcoin and proven on Stellar</title>
<desc id="liquidation-dark-desc">A keeper repays an unhealthy or matured loan into escrow, writz-lend selects the pre-signed step and the protocol signers co-sign it, the keeper broadcasts it on Bitcoin and proves its confirmation through bitcoin-spv, and writz-lend settles the escrow.</desc>
