<svg viewBox="0 0 960 504" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="stellar-contracts-dark-title stellar-contracts-dark-desc" id="stellar-contracts-dark-root">
<title id="stellar-contracts-dark-title">The contracts on Stellar</title>
<desc id="stellar-contracts-dark-desc">writz-lend reads the BTC/USD price from Reflector, moves USDC through the Stellar Asset Contract and asks bitcoin-spv to verify Bitcoin transactions; the relayer submits Bitcoin headers to bitcoin-spv and publishes release PSBTs to writz-lend.</desc>
