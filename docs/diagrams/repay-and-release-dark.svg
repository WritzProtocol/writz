<line x1="546" y1="448" x2="116" y2="448" stroke="#B6BBC4" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#repay-and-release-dark-arrow)"/>
<rect x="404.0" y="424" width="72" height="16" rx="2" fill="#0C0E12"/><text x="440.0" y="436" fill="#8B919B" font-size="10" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">RELEASE TX</text>
