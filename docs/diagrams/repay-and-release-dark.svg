<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 784" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="repay-and-release-dark-title repay-and-release-dark-desc" id="repay-and-release-dark-root">
<title id="repay-and-release-dark-title">Repaying a loan and releasing the Bitcoin</title>
<desc id="repay-and-release-dark-desc">After a full repayment writz-lend emits an event, the protocol signers check the position on Stellar and publish their co-signature, and the borrower signs and broadcasts the release; if the signers are unavailable, the borrower spends alone after the timelock.</desc>
<defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #repay-and-release-dark-root { font-family: 'Work Sans', system-ui, sans-serif; color: #F6F7F8; }
      #repay-and-release-dark-root .diagram-container { width:100%;overflow-x:auto }
      #repay-and-release-dark-root .diagram-container { overflow-x:visible }</style><marker id="repay-and-release-dark-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#B6BBC4"/></marker><marker id="repay-and-release-dark-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#FFC300"/></marker><marker id="repay-and-release-dark-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#8FB0D8"/></marker><marker id="repay-and-release-dark-arrow-open" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polyline points="0 0, 8 3, 0 6" fill="none" stroke="#B6BBC4" stroke-width="1.2"/></marker></defs>
<rect width="100%" height="100%" fill="#0C0E12"/>
<rect x="82" y="536" width="292" height="88" rx="4" fill="#f6f7f8" stroke="#f6f7f8" stroke-width="1" fill-opacity="0.04" stroke-opacity="0.22"/>
<rect x="82" y="536" width="40" height="16" rx="2" fill="#0C0E12" stroke="#f6f7f8" stroke-width="1" stroke-opacity="0.22"/>
<text x="102" y="548" fill="#B6BBC4" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.12em">OPT</text>
<text x="134" y="548" fill="#B6BBC4" font-size="10" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.04em">[signers unavailable, after height H]</text>
