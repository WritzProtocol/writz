<rect x="30.0" y="64" width="160" height="48" rx="6" fill="#15181E" stroke="#B6BBC4" stroke-width="1"/>
<text x="110.0" y="94.0" fill="#F6F7F8" font-size="16" font-weight="600" font-family="'Work Sans', system-ui, sans-serif" text-anchor="middle">Borrower</text>
<rect x="250.0" y="64" width="160" height="48" rx="6" fill="#0C0E12"/>
<rect x="250.0" y="64" width="160" height="48" rx="6" fill="#0C0E12" stroke="#F6F7F8" stroke-width="1"/>
<text x="330.0" y="94.0" fill="#F6F7F8" font-size="16" font-weight="600" font-family="'Work Sans', system-ui, sans-serif" text-anchor="middle">Bitcoin</text>
<rect x="470.0" y="64" width="160" height="48" rx="6" fill="#0C0E12"/>
<rect x="470.0" y="64" width="160" height="48" rx="6" fill="#ffc300" stroke="#FFC300" stroke-width="1.4" fill-opacity="0.12"/>
<text x="550.0" y="94.0" fill="#F6F7F8" font-size="16" font-weight="600" font-family="'Work Sans', system-ui, sans-serif" text-anchor="middle">writz-lend</text>
<rect x="680.0" y="64" width="160" height="48" rx="6" fill="#0C0E12"/>
<rect x="680.0" y="64" width="160" height="48" rx="6" fill="#0C0E12" stroke="#F6F7F8" stroke-width="1"/>
<text x="760.0" y="94.0" fill="#F6F7F8" font-size="16" font-weight="600" font-family="'Work Sans', system-ui, sans-serif" text-anchor="middle">Protocol signers</text>
<text x="24" y="684" fill="#B6BBC4" font-size="15" font-style="italic" font-family="'Work Sans', system-ui, sans-serif">Each protocol signer checks Stellar on its own and co-signs only a repaid position.</text>
<line x1="32" y1="720" x2="928" y2="720" stroke="#f6f7f8" stroke-width="0.8" stroke-opacity="0.12"/>
