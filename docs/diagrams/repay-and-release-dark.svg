<line x1="114" y1="600" x2="324" y2="600" stroke="#B6BBC4" stroke-width="1.2" marker-end="url(#repay-and-release-dark-arrow)"/>
<rect x="172.0" y="576" width="96" height="16" rx="2" fill="#0C0E12"/><text x="220.0" y="588" fill="#8B919B" font-size="10" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">TIMELOCK SPEND</text>
