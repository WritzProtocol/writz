<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 608" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="position-states-dark-title position-states-dark-desc" id="position-states-dark-root">
<title id="position-states-dark-title">Lifecycle of a Writz position</title>
<desc id="position-states-dark-desc">A position starts when a Bitcoin deposit is verified, moves between no debt and an open loan as the borrower borrows and repays, ends released, liquidated by a keeper when unhealthy or unpaid at maturity, or reclaimed by the borrower after the timelock, in which case an unpaid loan becomes a loss for lenders.</desc>
<defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #position-states-dark-root { font-family: 'Work Sans', system-ui, sans-serif; color: #F6F7F8; }
      #position-states-dark-root .diagram-container { width:100%;overflow-x:auto }
      #position-states-dark-root .diagram-container { overflow-x:visible }</style><marker id="position-states-dark-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#B6BBC4"/></marker><marker id="position-states-dark-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#FFC300"/></marker><marker id="position-states-dark-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#8FB0D8"/></marker><marker id="position-states-dark-arrow-open" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polyline points="0 0, 8 3, 0 6" fill="none" stroke="#B6BBC4" stroke-width="1.2"/></marker></defs>
