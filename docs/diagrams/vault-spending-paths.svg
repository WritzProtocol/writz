<title id="vault-spending-paths-title">Writz vault: spending paths</title>
<desc id="vault-spending-paths-desc">A Writz vault output can be spent on the cooperative path, by the borrower plus two of three protocol keys, to release a repaid loan or execute a pre-signed liquidation step, or on the timelock path by the borrower alone after height H.</desc>
